# ====================================
# SERVER CONFIGURATION
# ====================================
server.port=8080
server.servlet.context-path=/api

# ====================================
# DATABASE CONFIGURATION
# ====================================
# Default: H2 for local development (easy to get started)
# To use Supabase PostgreSQL, set these environment variables:
#   SUPABASE_DB_URL, SUPABASE_DB_USER, SUPABASE_DB_PASSWORD

# H2 Database (Development)
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:tennisfantasy}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${SUPABASE_DB_USER:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:password}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.datatype.hibernate5.force-lazy-loading=false

# ====================================
# SPORTRADAR API CONFIGURATION
# ====================================
# Get your API key from: https://developer.sportradar.com
sportradar.api.key=${SPORTRADAR_API_KEY}
sportradar.api.base-url=https://api.sportradar.com/tennis/trial/v3/en

# ====================================
# CACHING CONFIGURATION
# ====================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# ====================================
# JWT CONFIGURATION (Supabase Auth)
# ====================================
# Get your JWT secret from Supabase Dashboard -> Settings -> API -> JWT Secret
supabase.jwt.secret=${SUPABASE_JWT_SECRET:your-jwt-secret-here}
jwt.expiration=86400000

# ====================================
# SCHEDULING CONFIGURATION
# ====================================
# Enable scheduled tasks for data sync
spring.task.scheduling.pool.size=2

# ====================================
# LOGGING
# ====================================
logging.level.com.tennisfantasy.backend=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.reactive=DEBUG

# ====================================
# CORS CONFIGURATION
# ====================================
cors.allowed-origins=http://localhost:3000,http://localhost:3001
